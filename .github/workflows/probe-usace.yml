name: Probe USACE site (temporary diagnostic)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: |
          set +e
          pip install -q requests certifi 2>/dev/null
          echo "== edge function code under deno, 5 calls"
          (deno run --allow-net --allow-env web/supabase/functions/fm-usace-wq/index.ts &) ; sleep 6
          for i in 1 2 3 4 5; do curl -sS -X POST localhost:8000 | grep -o "Dam Site</td><td>[^<]*</td><td>0</td><td>[^<]*</td><td>[^<]*" | head -1 || echo FAILED; done
          curl -sS -X POST localhost:8000 | head -c 150
