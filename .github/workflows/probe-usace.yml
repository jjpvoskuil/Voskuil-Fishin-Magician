name: Probe USACE site (temporary diagnostic)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: |
          set +e
          curl -sS -o /tmp/ica.crt http://cacerts.digicert.com/DigiCertGlobalG2TLSRSASHA2562020CA1-1.crt
          openssl x509 -inform DER -in /tmp/ica.crt -out /tmp/ica.pem && openssl x509 -in /tmp/ica.pem -noout -subject -issuer -enddate -fingerprint -sha256
          echo "== PEM"; cat /tmp/ica.pem
          echo "== curl with intermediate added"; cat /etc/ssl/certs/ca-certificates.crt /tmp/ica.pem > /tmp/bundle.pem
          curl -sS --cacert /tmp/bundle.pem -o /tmp/a.html -w "%{http_code} %{size_download}\n" https://www.lrl-wc.usace.army.mil/reports/wq/NRR.html
          grep -io "Dam Site</td>.\{0,80\}" /tmp/a.html | head -2
          echo "== python with bundle"; python3 -c "import requests;r=requests.get('https://www.lrl-wc.usace.army.mil/reports/wq/NRR.html',timeout=20,verify='/tmp/bundle.pem');print(r.status_code,len(r.text))"
          echo "== deno createHttpClient caCerts=[intermediate]"
          cat > /tmp/t.ts <<'TS'
          const pem = await Deno.readTextFile("/tmp/ica.pem");
          // @ts-ignore
          const client = Deno.createHttpClient({ caCerts: [pem] });
          const r = await fetch("https://www.lrl-wc.usace.army.mil/reports/wq/NRR.html", { client });
          console.log("deno", r.status, (await r.text()).length);
          TS
          deno run --allow-net --allow-read /tmp/t.ts
