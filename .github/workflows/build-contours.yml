name: Build lake contours (lidar)
# Run by hand when the contour method changes. Reads KyFromAbove's public lidar (too big for the dev sandbox) and
# pushes contours.json to the side branch "depth-build"; Claude copies it into web/public/depth/ on main (a commit
# from this workflow wouldn't trigger the Pages build, and the sandbox can't download artifacts).
on:
  workflow_dispatch:
    inputs:
      topo:
        description: "1 = read the bottom below the lidar water line from the pre-dam 1953/54 USGS maps (option B, 11-14); output goes to branch depth-build-topo"
        default: "0"
      debug:
        description: "1 = also write topo debug overlays; 2 = overlays only, then stop"
        default: "0"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q rasterio pystac-client pyproj numpy scipy scikit-image shapely pillow
      - run: python tools/build_contours.py out || [ "${{ inputs.debug }}" = "2" ]
        env:
          TOPO: ${{ inputs.topo }}
          TOPO_DEBUG: ${{ inputs.debug != '0' && '1' || '0' }}
          TOPO_STOP: ${{ inputs.debug == '2' && '1' || '0' }}
      - name: Push to the depth-build branch
        run: |
          BR=depth-build; [ "${{ inputs.topo }}" = "1" ] && BR=depth-build-topo
          cd out && git init -q && git checkout -q -b $BR && git add -A
          git -c user.name="contour builder" -c user.email="actions@github.com" commit -qm "contours $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" $BR
